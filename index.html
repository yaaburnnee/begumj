<script>
document.addEventListener("DOMContentLoaded", function (e) {
    const firstCard = document.querySelector(".social-card:not(.second-card)");
    const secondCard = document.querySelector(".social-card.second-card");
    const aboutButton = document.querySelector('.menu-item img[alt="About"]')?.closest(".menu-item");
    const workButton = document.getElementById("workButton");

    if (!firstCard || !secondCard) return;

    /* 2. buton: ilk kutuyu büyüt */
    if (aboutButton) {
        aboutButton.addEventListener("click", function (e) {
            e.preventDefault();
            firstCard.classList.toggle("active-card");
        });
    }

    /* 2. kutu aşağıda daha geç görünür */
    let revealed = false;

    function revealSecondCard() {
        if (revealed) return;

        const rect = secondCard.getBoundingClientRect();

        /* Kutu ekranın altına iyice yaklaşınca açılır */
        if (rect.top <= window.innerHeight - 180) {
            revealed = true;
            secondCard.classList.add("is-visible");
            startTyping();
        }
    }

    function startTyping() {
        const words = secondCard.querySelectorAll(".text2 .word");
        words.forEach(word => {
            word.style.opacity = "0";
            word.style.transform = "translateY(18px)";
        });

        let i = 0;

        function showNextWord() {
            if (i >= words.length) return;

            words[i].style.opacity = "1";
            words[i].style.transform = "translateY(0)";
            i++;

            setTimeout(showNextWord, 350);
        }

        setTimeout(showNextWord, 500);
    }

    window.addEventListener("scroll", revealSecondCard, { passive: true });
    window.addEventListener("resize", revealSecondCard);
    revealSecondCard();

    /* 3. buton: 2. kutu büyür */
    if (workButton) {
        workButton.addEventListener("click", function (e) {
            e.preventDefault();
            secondCard.classList.add("is-visible");
            secondCard.classList.toggle("is-active");
        });
    }

    /* 4. buton: en alttaki yazıyı yeşil yap ve altına yeni metin çıkar */
    const button4 = document.getElementById("button4");
    const text3 = document.getElementById("text3");
    const newText3 = document.getElementById("newText3");

    if (button4 && text3 && newText3) {
        button4.addEventListener("click", function (e) {
            e.preventDefault();
            text3.classList.add("green");
            newText3.textContent = "w/mertkalayj";
            newText3.classList.add("show");
        });
    }
});
</script>
